# De controles draaien bij elke push, in plaats van enkel wanneer iemand eraan denkt.
#
# Dat laatste was het punt: er zijn er intussen 468, ze draaien in ongeveer een minuut, en ze
# vinden precies het soort fout dat je zelf niet ziet - een site die stil niets meer teruggeeft,
# een prijs die null wordt, een slot dat blijft hangen. Een controle die niet draait, is geen
# controle.
#
# windows-latest, want het is een WPF-project (net10.0-windows) en een deel van de controles
# leest de opdrachtregel van een proces uit via een Windows-API.

name: Controles

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # en met de hand, vanaf het tabblad Actions

# Een nieuwe push maakt een lopende beurt overbodig.
concurrency:
  group: controles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controles:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: De code ophalen
        uses: actions/checkout@v7

      - name: .NET 10 klaarzetten
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # De app zelf bouwen vangt wat de controles niet zien: de XAML-compiler kijkt elke
      # Click= na in de code-behind, dus een verkeerde naam komt er niet door.
      - name: De app bouwen
        run: dotnet build Vindioo.csproj -c Release --nologo

      # --snel slaat de ene controle over die dertig seconden op een time-out wacht.
      # Vindioo.Checks geeft exitcode 1 zodra er iets FOUT is, dus GitHub ziet het vanzelf.
      #
      # Wat er op deze machine anders is dan thuis, en waarom dat geen fouten geeft:
      #   - geen Vindioo en geen Chrome, dus de brug-groep en de koppelcode-controles draaien
      #     hier juist allemaal mee (thuis vallen er dan 23 weg);
      #   - de tijdzone is UTC, en die kent geen zomertijd. De controle op de overgang naar de
      #     wintertijd merkt dat zelf en slaat het stuk over dat een uur verschil verwacht.
      - name: De controles draaien
        run: dotnet run --project tests/Vindioo.Checks -c Release -- --snel

      # De extensie is JavaScript en komt dus niet in de C#-controles voor. Deze twee draaien
      # de échte functies uit background.js tegen een nagebootste app en een nagebootste Chrome.
      # Ze staan in tools/ omdat je ze met de hand kan draaien, maar wat ze meten is te
      # belangrijk om daarvan afhankelijk te zijn: de extensie werkt met jouw cookies.
      #
      # windows-latest heeft Node al; daar is geen setup-node voor nodig.
      # Eerst de syntaxis van het hele bestand. De metingen hieronder knippen er stukken uit en
      # draaien die; een fout buiten zo'n stuk zou dus elke meting halen terwijl Chrome het
      # script helemaal niet meer laadt. Dat gat is op 2 oktober 2026 gevonden bij het zoeken
      # naar een contextmenu dat niet verscheen - het bleek er niet aan te liggen, maar het gat
      # was er wel.
      - name: De extensie nakijken en nameten
        run: |
          node --check extension/background.js
          node --check extension/popup.js
          node tools/meet-brug-handtekening.mjs
          node tools/meet-extensie-toegang.mjs
